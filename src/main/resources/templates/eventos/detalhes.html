<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<!-- Compiled and minified CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<title>Eventos</title>
</head>
<body>
	<div th:replace="~{menu :: menu}"></div>

	<div class="container">
		<h1>Detalhes de eventos</h1>

		<div class="row">
			<div class="col s12">
				<div class="card blue-grey darken-1">
					<div class="card-content white-text">
						<span class="card-title">Evento</span>
						<p>
							<strong>Id: </strong>
							<samp th:text="${evento.id}">1</samp>
						</p>
						<p>
							<strong>Nome: </strong>
							<samp th:text="${evento.nome}">Aniversário de josé</samp>
						</p>
						<p>
							<strong>Local: </strong>
							<samp th:text="${evento.local}">Clube</samp>
						</p>
						<p>
							<strong>Data: </strong>
							<samp th:text="${evento.data}">25/02/2021</samp>
						</p>
						<p>
							<strong>Horário: </strong>
							<samp th:text="${evento.horario}">20:00</samp>
						</p>
					</div>

				</div>
			</div>
		</div>
	</div>



</body>
</html>

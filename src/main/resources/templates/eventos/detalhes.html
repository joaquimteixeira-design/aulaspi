<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<!-- Compiled and minified CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons"
	rel="stylesheet">
<title>Eventos</title>
</head>
<body>
	<div th:replace="~{menu :: menu}"></div>

	<div class="container">
		<h1>Detalhes de eventos</h1>

		<div class="row">
			<div class="col s12">
				<div class="card">
					<div class="card-content">
						<span class="card-title">Evento</span>
						<p>
							<strong>Id: </strong>
							<samp th:text="${evento.id}">1</samp>
						</p>
						<p>
							<strong>Nome: </strong>
							<samp th:text="${evento.nome}">Aniversário de josé</samp>
						</p>
						<p>
							<strong>Local: </strong>
							<samp th:text="${evento.local}">Clube</samp>
						</p>
						<p>
							<strong>Data: </strong>
							<samp th:text="${evento.data}">25/02/2021</samp>
						</p>
						<p>
							<strong>Horário: </strong>
							<samp th:text="${evento.horario}">20:00</samp>
						</p>
					</div>

				</div>
			</div>
		</div>


		<div class="row">
			<div class="col s12">
				<div class="card">
					<div class="card-content">
						<span class="card-title">Adicionar Convidado:</span>
						<form action="" method="post">
							<div>
								<label>Nome: </label> <input type="text" name="nome">
							</div>
							<div>
								<label>RG: </label> <input type="text" name="rg">
							</div>
							<div>
								<button type="submit" class="btn">Salvar</button>
								<button type="reset" class="btn">Limpar</button>
							</div>
						</form>
					</div>

				</div>
			</div>
		</div>

		<div class="row">
			<div class="col s12">
				<div class="card">
					<div class="card-content">
						<span class="card-title">Convidados</span>
						<table class="highlight">
							<thead>
								<tr>
									<th>Id:</th>
									<th>Nome:</th>
									<th>Rg:</th>
									<th></th>
									<!-- Cabeçalho vazio para a coluna do botão -->
								</tr>
							</thead>
							<tbody>
								<tr th:each="c : ${convidado}">
									<td th:text="${c.id}">1</td>
									<td th:text="${c.nome}">Fernando Soares</td>
									<td th:text="${c.rg}">123</td>
									<!-- Botão de remover que envia o ID do Evento e o ID do Convidado -->
									<td><a
										th:href="@{/eventos/{idEvento}/convidados/{idConvidado}/remover(idEvento=${evento.id}, idConvidado=${c.id})}">
											<i class="material-icons">delete</i>
									</a></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>





	</div>



</body>
</html>
